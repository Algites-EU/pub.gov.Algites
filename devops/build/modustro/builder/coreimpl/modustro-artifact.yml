# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java]
  Name: Modustro Builder core implementation
  Description: Gradle-independent reusable implementation of Modustro Builder inheritance, validation, and dependency technology resolution planning.

Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.pltf.modustro.builder
        ArtifactId: pub.gov.Algites_devops.build.modustro.builder.coreintf
        Usages: [product_api]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_version.core
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_version.scheme.algites.v1
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_version.scheme.gradle
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_version.scheme.pep440
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_version.scheme.conversion.algites2gradle.v1
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_version.scheme.conversion.algites2pep440.v1
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
  - DependencyKind: java
    Items:
      - GroupId: com.fasterxml.jackson.core
        ArtifactId: jackson-databind
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "2.18.3"
      - GroupId: com.fasterxml.jackson.dataformat
        ArtifactId: jackson-dataformat-yaml
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "2.18.3"
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=7.0.0"
          Maximum: "<8.0.0"
          MaximumStrict: true

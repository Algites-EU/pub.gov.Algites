name: Algites Credential Bridge
description: Filter and materialize the universal Algites credential document for the credential profiles required by the current GitHub Actions operation.
inputs:
  credentials-json:
    description: Universal ALGITES_DEVOPS_BUILD_REPOSITORY_CREDENTIALS JSON document.
    required: false
    default: ""
  required-credentials-file:
    description: JSON credential preflight plan generated by resolveAlgitesRequiredCredentials.
    required: true
  secrets-json:
    description: JSON representation of the GitHub Actions secrets context used by SECRET_CONTENT references.
    required: false
    default: "{}"
runs:
  using: composite
  steps:
    - name: Materialize Algites credentials
      shell: bash
      env:
        ALGITES_CREDENTIALS_JSON: ${{ inputs.credentials-json }}
        ALGITES_REQUIRED_CREDENTIALS_FILE: ${{ inputs.required-credentials-file }}
        ALGITES_CREDENTIAL_SECRETS_JSON: ${{ inputs.secrets-json }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/export-credential-secrets.py"

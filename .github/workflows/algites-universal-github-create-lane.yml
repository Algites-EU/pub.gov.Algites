name: Algites Universal Create Lane

on:
  workflow_dispatch:
    inputs:
      source_lane:
        description: "Source lane (e.g. 1.1)"
        required: true
      new_lane:
        description: "New lane (e.g. 1.2)"
        required: true
      variants:
        description: "auto (discover) or explicit list"
        required: false
        default: "auto"
      variants_explicit:
        description: "Comma-separated variants when variants=explicit (e.g. jvm17,and21)"
        required: false
        default: ""
      github-app-enabled:
        type: boolean
        description: "Indication the Github Application for the task is enabled"
        required: false
        default: false

  workflow_call:
    inputs:
      source_lane:
        description: "Source lane (e.g. 1.1)"
        required: true
        type: string
      new_lane:
        description: "New lane (e.g. 1.2)"
        required: true
        type: string
      variants:
        description: "auto (discover) or explicit list"
        required: false
        type: string
        default: "auto"
      variants_explicit:
        description: "Comma-separated variants when variants=explicit (e.g. jvm17,and21)"
        required: false
        type: string
        default: ""
      github-app-enabled:
        type: boolean
        description: "Indication the Github Application for the task is enabled"
        required: false
        default: false
    secrets:
      GITHUB_APP_ID:
        required: false
      GITHUB_APP_INSTALLATION_ID:
        required: false
      GITHUB_APP_PEM:
        required: false

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate lanes
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ inputs.source_lane }}"
          NEW="${{ inputs.new_lane }}"
          for L in "$SRC" "$NEW"; do
            if [[ ! "$L" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "ERROR: lane must be numeric dot-separated identifier, e.g. 1 or 1.1. Got: '$L'." >&2
              exit 1
            fi
          done

      - name: Discover variants
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ inputs.source_lane }}"
          MODE="${{ inputs.variants }}"
          MODE="$(echo "$MODE" | tr '[:upper:]' '[:lower:]')"

          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"

          VARS=()
          if [[ "$MODE" == "explicit" ]]; then
            RAW="${{ inputs.variants_explicit }}"
            RAW="${RAW// /}"
            if [[ -z "$RAW" ]]; then
              echo "ERROR: variants=explicit but variants_explicit is empty." >&2
              exit 1
            fi
            IFS=',' read -r -a VARS <<< "$RAW"
          else
            while IFS= read -r br; do
              br="${br#origin/}"
              if [[ "$br" =~ ^([^/]+)/lane/${SRC}$ ]]; then
                VARS+=("${BASH_REMATCH[1]}")
              fi
            done < <(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/*/lane/${SRC}" || true)

            if (( ${#VARS[@]} > 0 )); then
              VARS=($(printf "%s\n" "${VARS[@]}" | sort -u))
            fi
          fi

          if (( ${#VARS[@]} == 0 )); then
            echo "ERROR: No variants discovered for source lane '${SRC}'." >&2
            exit 1
          fi

          CSV="$(IFS=','; echo "${VARS[*]}")"
          echo "variants_csv=$CSV" >> "$GITHUB_OUTPUT"

          {
            echo "### Create lane variants"
            echo ""
            echo '```'
            echo "$CSV"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create new lane branches (per variant)
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ inputs.source_lane }}"
          NEW="${{ inputs.new_lane }}"
          CSV="${{ steps.vars.outputs.variants_csv }}"

          git config user.name "algites-ci"
          git config user.email "ci@algites.eu"

          IFS=',' read -r -a VARS <<< "$CSV"
          for V in "${VARS[@]}"; do
            FROM="${V}/lane/${SRC}"
            TO="${V}/lane/${NEW}"

            if ! git show-ref --verify --quiet "refs/remotes/origin/${FROM}"; then
              echo "WARNING: Source branch missing: ${FROM}. Skipping."
              continue
            fi

            if git show-ref --verify --quiet "refs/remotes/origin/${TO}"; then
              echo "WARNING: Target already exists: ${TO}. Skipping."
              continue
            fi

            TMP="create-lane/${TO}-$(date +%Y%m%d%H%M%S)"
            git switch -c "$TMP" "refs/remotes/origin/${FROM}"

            if [[ ! -f "algites-source-repository.yml" ]]; then
              echo "ERROR: algites-source-repository.yml not found in repo root on ${FROM}." >&2
              exit 1
            fi

            python3 - "$NEW" <<'PY'
          import re
          import sys
          from pathlib import Path
          
          locNewLane = sys.argv[1]
          locPath = Path("algites-source-repository.yml")
          locText = locPath.read_text(encoding="utf-8")
          
          locMatch = re.search(r"(?m)^versionContext:\s*$", locText)
          if not locMatch:
              locText = locText.rstrip() + "\n\nversionContext:\n  releaseLine: \"%s\"\n  revision: 0\n  qualifierKind: SNAPSHOT\n  qualifierLabel: SNAPSHOT\n" % locNewLane
          else:
              locStart = locMatch.end()
              locNext = re.search(r"(?m)^[A-Za-z0-9_-]+:\s*$", locText[locStart:])
              locEnd = locStart + locNext.start() if locNext else len(locText)
              locBlock = locText[locStart:locEnd]
              if re.search(r"(?m)^\s+releaseLine:\s*", locBlock):
                  locBlock = re.sub(r"(?m)^(\s+releaseLine:\s*).*$", r"\1\"%s\"" % locNewLane, locBlock, count=1)
              else:
                  locBlock = "\n  releaseLine: \"%s\"" % locNewLane + locBlock
              if not re.search(r"(?m)^\s+revision:\s*", locBlock):
                  locBlock += "  revision: 0\n"
              if not re.search(r"(?m)^\s+qualifierKind:\s*", locBlock):
                  locBlock += "  qualifierKind: SNAPSHOT\n"
              if not re.search(r"(?m)^\s+qualifierLabel:\s*", locBlock):
                  locBlock += "  qualifierLabel: SNAPSHOT\n"
              locText = locText[:locStart] + locBlock + locText[locEnd:]
          
          locPath.write_text(locText, encoding="utf-8")
            PY

            git add algites-source-repository.yml
            git commit -m "Create lane ${TO} (from ${FROM})"
            git push origin "HEAD:${TO}"

            git switch -
            git branch -D "$TMP" || true

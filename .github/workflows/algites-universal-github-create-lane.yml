name: Algites Universal Create Lane

on:
  workflow_dispatch:
    inputs:
      source_lane:
        description: "Source lane (e.g. 1.1)"
        required: true
      new_lane:
        description: "New lane (e.g. 1.2)"
        required: true
      variants:
        description: "auto (discover) or explicit list"
        required: false
        default: "auto"
      variants_explicit:
        description: "Comma-separated variants when variants=explicit (e.g. jvm17,and21)"
        required: false
        default: ""
      github-app-enabled:
        type: boolean
        description: "Indication the Github Application for the task is enabled"
        required: false
        default: false

  workflow_call:
    inputs:
      source_lane:
        description: "Source lane (e.g. 1.1)"
        required: true
        type: string
      new_lane:
        description: "New lane (e.g. 1.2)"
        required: true
        type: string
      variants:
        description: "auto (discover) or explicit list"
        required: false
        type: string
        default: "auto"
      variants_explicit:
        description: "Comma-separated variants when variants=explicit (e.g. jvm17,and21)"
        required: false
        type: string
        default: ""
      github-app-enabled:
        type: boolean
        description: "Indication the Github Application for the task is enabled"
        required: false
        default: false
    secrets:
      GITHUB_APP_ID:
        required: false
      GITHUB_APP_INSTALLATION_ID:
        required: false
      GITHUB_APP_PEM:
        required: false

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate lanes
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ inputs.source_lane }}"
          NEW="${{ inputs.new_lane }}"
          for L in "$SRC" "$NEW"; do
            if [[ ! "$L" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "ERROR: lane must be numeric dot-separated identifier, e.g. 1 or 1.1. Got: '$L'." >&2
              exit 1
            fi
          done

      - name: Discover variants
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ inputs.source_lane }}"
          MODE="${{ inputs.variants }}"
          MODE="$(echo "$MODE" | tr '[:upper:]' '[:lower:]')"

          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"

          VARS=()
          if [[ "$MODE" == "explicit" ]]; then
            RAW="${{ inputs.variants_explicit }}"
            RAW="${RAW// /}"
            if [[ -z "$RAW" ]]; then
              echo "ERROR: variants=explicit but variants_explicit is empty." >&2
              exit 1
            fi
            IFS=',' read -r -a VARS <<< "$RAW"
          else
            while IFS= read -r br; do
              br="${br#origin/}"
              if [[ "$br" =~ ^([^/]+)/lane/${SRC}$ ]]; then
                VARS+=("${BASH_REMATCH[1]}")
              fi
            done < <(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/*/lane/${SRC}" || true)

            if (( ${#VARS[@]} > 0 )); then
              VARS=($(printf "%s\n" "${VARS[@]}" | sort -u))
            fi
          fi

          if (( ${#VARS[@]} == 0 )); then
            echo "ERROR: No variants discovered for source lane '${SRC}'." >&2
            exit 1
          fi

          CSV="$(IFS=','; echo "${VARS[*]}")"
          echo "variants_csv=$CSV" >> "$GITHUB_OUTPUT"

          {
            echo "### Create lane variants"
            echo ""
            echo '```'
            echo "$CSV"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create new lane branches (per variant)
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ inputs.source_lane }}"
          NEW="${{ inputs.new_lane }}"
          CSV="${{ steps.vars.outputs.variants_csv }}"

          git config user.name "algites-ci"
          git config user.email "ci@algites.eu"

          IFS=',' read -r -a VARS <<< "$CSV"
          for V in "${VARS[@]}"; do
            FROM="${V}/lane/${SRC}"
            TO="${V}/lane/${NEW}"

            if ! git show-ref --verify --quiet "refs/remotes/origin/${FROM}"; then
              echo "WARNING: Source branch missing: ${FROM}. Skipping."
              continue
            fi

            if git show-ref --verify --quiet "refs/remotes/origin/${TO}"; then
              echo "WARNING: Target already exists: ${TO}. Skipping."
              continue
            fi

            TMP="create-lane/${TO}-$(date +%Y%m%d%H%M%S)"
            git switch -c "$TMP" "refs/remotes/origin/${FROM}"

            if [[ ! -f "algites-source-repository.yml" ]]; then
              echo "ERROR: algites-source-repository.yml not found in repo root on ${FROM}." >&2
              exit 1
            fi

            python3 - "$NEW" <<'PY'
          import re
          import sys
          from pathlib import Path

          locNewLane = sys.argv[1]
          locPath = Path("algites-source-repository.yml")
          locText = locPath.read_text(encoding="utf-8")

          locMatch = re.search(r"(?m)^versionContext:\s*$", locText)
          if not locMatch:
              locText = locText.rstrip() + "\n\nversionContext:\n  lane: \"%s\"\n  revision: 0\n  qualifierKind: SNAPSHOT\n  qualifierLabel: SNAPSHOT\n" % locNewLane
          else:
              locStart = locMatch.end()
              locNext = re.search(r"(?m)^[A-Za-z0-9_-]+:\s*$", locText[locStart:])
              locEnd = locStart + locNext.start() if locNext else len(locText)
              locBlock = locText[locStart:locEnd]
              if re.search(r"(?m)^\s+lane:\s*", locBlock):
                  locBlock = re.sub(r"(?m)^(\s+lane:\s*).*$", r"\1\"%s\"" % locNewLane, locBlock, count=1)
              elif re.search(r"(?m)^\s+releaseLine:\s*", locBlock):
                  locBlock = re.sub(r"(?m)^(\s+)releaseLine:\s*.*$", r"\1lane: \"%s\"" % locNewLane, locBlock, count=1)
              else:
                  locBlock = "\n  lane: \"%s\"" % locNewLane + locBlock
              if re.search(r"(?m)^\s+revision:\s*", locBlock):
                  locBlock = re.sub(r"(?m)^(\s+revision:\s*).*$", r"\g<1>0", locBlock, count=1)
              else:
                  locBlock += "  revision: 0\n"
              if re.search(r"(?m)^\s+qualifierKind:\s*", locBlock):
                  locBlock = re.sub(r"(?m)^(\s+qualifierKind:\s*).*$", r"\g<1>SNAPSHOT", locBlock, count=1)
              else:
                  locBlock += "  qualifierKind: SNAPSHOT\n"
              if re.search(r"(?m)^\s+qualifierLabel:\s*", locBlock):
                  locBlock = re.sub(r"(?m)^(\s+qualifierLabel:\s*).*$", r"\g<1>SNAPSHOT", locBlock, count=1)
              else:
                  locBlock += "  qualifierLabel: SNAPSHOT\n"
              locText = locText[:locStart] + locBlock + locText[locEnd:]

          locPath.write_text(locText, encoding="utf-8")
          PY

            LOC_RESOLVER_PROJECT_DIR="${RUNNER_TEMP}/algites-resolve-artifact-metadata-${V//\//-}-project"
            LOC_RESOLVED_PROPERTIES_FILE="${RUNNER_TEMP}/algites-resolved-artifact-metadata-${V//\//-}.properties"

            rm -rf "${LOC_RESOLVER_PROJECT_DIR}"
            mkdir -p "${LOC_RESOLVER_PROJECT_DIR}"

            cat > "${LOC_RESOLVER_PROJECT_DIR}/settings.gradle.kts" <<'KTS'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  mavenCentral()
                  google()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  mavenCentral()
                  google()
              }
          }

          rootProject.name = "algites-resolve-artifact-metadata"
          KTS

            cat > "${LOC_RESOLVER_PROJECT_DIR}/build.gradle.kts" <<'KTS'
          import java.io.File

          val locRepositoryDirectory = File(System.getenv("ALGITES_METADATA_REPOSITORY_DIR"))
          val locResolverCoreScript = File(locRepositoryDirectory, "gradle/tool/repository/algites-artifact-directory-metadata-resolver.gradle.kts")

          if (locResolverCoreScript.isFile) {
              apply(from = locResolverCoreScript)
          } else {
              apply(from = uri("https://raw.githubusercontent.com/Algites-EU/pub.gov.Algites/main/gradle/tool/repository/algites-artifact-directory-metadata-resolver.gradle.kts"))
          }

          tasks.register("writeAlgitesResolvedArtifactMetadataProperties") {
              group = "algites"
              description = "Writes resolved Algites artifact metadata properties for GitHub Actions."

              doLast {
                  @Suppress("UNCHECKED_CAST")
                  val locResolveMetadataMap = rootProject.extra["algitesResolveArtifactDirectoryMetadataMap"] as (
                      File,
                      String?,
                      String?,
                      String?,
                      String?
                  ) -> Map<String, Any?>

                  @Suppress("UNCHECKED_CAST")
                  val locFlattenMetadata = rootProject.extra["algitesFlattenArtifactDirectoryMetadata"] as (Map<String, Any?>) -> Map<String, String>

                  val locMetadata = locResolveMetadataMap(
                      locRepositoryDirectory,
                      "",
                      "current-with-subdirs",
                      providers.gradleProperty("repository.name").orNull,
                      providers.gradleProperty("repository.visibility").orNull
                  )
                  val locProperties = locFlattenMetadata(locMetadata)
                  val locOutputFile = File(System.getenv("ALGITES_RESOLVED_PROPERTIES_FILE"))

                  locOutputFile.parentFile.mkdirs()
                  locOutputFile.writeText(
                      locProperties.entries
                          .sortedBy { it.key }
                          .joinToString(System.lineSeparator()) { locEntry ->
                              "${locEntry.key}=${locEntry.value}"
                          } + System.lineSeparator(),
                      Charsets.UTF_8
                  )
              }
          }
          KTS

            ALGITES_METADATA_REPOSITORY_DIR="${PWD}" ALGITES_RESOLVED_PROPERTIES_FILE="${LOC_RESOLVED_PROPERTIES_FILE}" ./gradlew --no-daemon --quiet --project-dir "${LOC_RESOLVER_PROJECT_DIR}" writeAlgitesResolvedArtifactMetadataProperties

            LOC_RESOLVED_LANE="$(grep -m 1 '^artifactDirectories\.0\.version\.lane=' "${LOC_RESOLVED_PROPERTIES_FILE}" | cut -d= -f2- || true)"
            LOC_RESOLVED_QUALIFIER_KIND="$(grep -m 1 '^artifactDirectories\.0\.version\.qualifierKind=' "${LOC_RESOLVED_PROPERTIES_FILE}" | cut -d= -f2- || true)"
            if [[ "${LOC_RESOLVED_LANE}" != "${NEW}" ]]; then
              echo "ERROR: Resolved lane '${LOC_RESOLVED_LANE}' does not match requested new lane '${NEW}' on ${TO}." >&2
              exit 1
            fi
            if [[ "${LOC_RESOLVED_QUALIFIER_KIND}" != "SNAPSHOT" ]]; then
              echo "ERROR: Resolved qualifier kind '${LOC_RESOLVED_QUALIFIER_KIND}' does not match expected SNAPSHOT on ${TO}." >&2
              exit 1
            fi

            git add algites-source-repository.yml
            git commit -m "Create lane ${TO} (from ${FROM})"
            git push origin "HEAD:${TO}"

            git switch -
            git branch -D "$TMP" || true

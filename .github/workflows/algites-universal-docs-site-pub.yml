name: Generate and publish Algites documentation site

on:
  workflow_call:
    inputs:
      source-ref:
        description: Branch, tag, or commit to check out. Defaults to the calling workflow ref.
        required: false
        type: string
        default: ""
      gradle-task:
        description: Gradle task that generates the documentation site.
        required: false
        type: string
        default: generateAlgitesDocsSite
      java-version:
        description: Java version used for Gradle execution.
        required: false
        type: string
        default: "21"
      publication-kind:
        description: "Documentation publication kind: preview, snapshot, or release."
        required: false
        type: string
        default: preview
      publication-id:
        description: Documentation publication identifier. Defaults to the checked out branch/tag name.
        required: false
        type: string
        default: ""
      pages-branch:
        description: Branch that stores the persistent generated documentation site.
        required: false
        type: string
        default: gh-pages
      gradle-arguments:
        description: Additional Gradle arguments.
        required: false
        type: string
        default: ""
      publish-pages:
        description: Whether to persist and deploy the generated documentation to GitHub Pages.
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ALGITES_DOCS_DEFAULT_REF: ${{ github.head_ref || github.ref_name }}

concurrency:
  group: algites-docs-pages-${{ github.repository }}-${{ inputs.pages-branch }}
  cancel-in-progress: false

jobs:
  generate-and-publish-docs:
    name: Generate and publish documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Resolve documentation publication parameters
        id: publication
        shell: bash
        run: |
          set -euo pipefail

          locSourceRef="${{ inputs.source-ref }}"
          if [[ -z "${locSourceRef}" ]]; then
            locSourceRef="${ALGITES_DOCS_DEFAULT_REF}"
          fi

          locPublicationId="${{ inputs.publication-id }}"
          if [[ -z "${locPublicationId}" ]]; then
            locPublicationId="${locSourceRef}"
          fi

          echo "source-ref=${locSourceRef}" >> "${GITHUB_OUTPUT}"
          echo "publication-kind=${{ inputs.publication-kind }}" >> "${GITHUB_OUTPUT}"
          echo "publication-id=${locPublicationId}" >> "${GITHUB_OUTPUT}"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.publication.outputs.source-ref }}
          path: source

      - name: Prepare persistent Pages branch workspace
        shell: bash
        run: |
          set -euo pipefail

          locPagesBranch="${{ inputs.pages-branch }}"

          mkdir -p gh-pages
          cd gh-pages

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads origin "${locPagesBranch}" >/dev/null 2>&1; then
            git fetch --depth=1 origin "${locPagesBranch}"
            git checkout "${locPagesBranch}"
          else
            git checkout --orphan "${locPagesBranch}"
            git rm -rf . >/dev/null 2>&1 || true
            locRepositoryFullName="${{ github.repository }}"
            locRepositoryName="${locRepositoryFullName##*/}"
            locRepositoryHtmlUrl="https://github.com/${locRepositoryFullName}"

          cat > index.html <<EOF
            <!doctype html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Algites ${locRepositoryName} Repository Documentation</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <style>
                body {
                  margin: 0;
                  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  line-height: 1.5;
                  color: #1f2937;
                  background: #f9fafb;
                }

                header, main {
                  max-width: 1100px;
                  margin: 0 auto;
                  padding: 1.5rem;
                }

                header {
                  padding-top: 2rem;
                }

                h1 {
                  margin: 0 0 0.5rem 0;
                  font-size: 2rem;
                }

                .card {
                  background: white;
                  border: 1px solid #e5e7eb;
                  border-radius: 0.75rem;
                  padding: 1rem 1.25rem;
                  margin: 1rem 0;
                  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
                }

                iframe {
                  width: 100%;
                  min-height: 70vh;
                  border: 1px solid #e5e7eb;
                  border-radius: 0.75rem;
                  background: white;
                }

                a {
                  color: #2563eb;
                }
              </style>
            </head>
            <body>
              <header>
                <h1>Algites <strong>${locRepositoryName}</strong> Repository Documentation</h1>
                <p>
                  This page is the stable repository documentation entry point.
                  Generated artifact documentation is published under
                  <a href="generated/index.html">generated/</a>.
                </p>
                <p>
                  ${locRepositoryName} repository home is <a href="${locRepositoryHtmlUrl}">here</a>.
                </p>
              </header>

              <main>
                <section class="card">
                  <h2>Generated Artifact Documentation</h2>
                  <p>
                    The content below is generated automatically. If the embedded view is not available,
                    open the generated documentation index directly:
                    <a href="generated/index.html">generated/index.html</a>.
                  </p>
                </section>

                <iframe src="generated/index.html" title="Generated artifact documentation"></iframe>
              </main>
            </body>
            </html>
          EOF

            touch .nojekyll
            git add index.html .nojekyll
            git commit -m "Initialize documentation site"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate documentation site into persistent Pages workspace
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon \
            ${{ inputs.gradle-task }} \
            -Palgites.docs.siteRoot="${GITHUB_WORKSPACE}/gh-pages" \
            -Palgites.docs.publicationKind="${{ steps.publication.outputs.publication-kind }}" \
            -Palgites.docs.publicationId="${{ steps.publication.outputs.publication-id }}" \
            ${{ inputs.gradle-arguments }}

      - name: Commit generated documentation to persistent Pages branch
        if: ${{ inputs.publish-pages }}
        working-directory: gh-pages
        shell: bash
        run: |
          set -euo pipefail

          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "No documentation changes to persist."
            exit 0
          fi

          git commit -m "Publish documentation for ${{ steps.publication.outputs.publication-kind }}/${{ steps.publication.outputs.publication-id }}"
          git push origin HEAD:${{ inputs.pages-branch }}

      - name: Upload documentation site as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: algites-docs-site
          path: gh-pages
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: ${{ inputs.publish-pages }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.publish-pages }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Deploy GitHub Pages
        if: ${{ inputs.publish-pages }}
        id: deploy-pages
        uses: actions/deploy-pages@v4

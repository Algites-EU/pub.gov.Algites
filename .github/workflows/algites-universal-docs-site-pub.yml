name: Generate and publish Algites documentation site

"on":
  workflow_call:
    inputs:
      source-ref:
        description: Branch, tag, or commit to check out. Defaults to the calling workflow ref.
        required: false
        type: string
        default: ""
      gradle-task:
        description: Gradle task that generates the documentation site.
        required: false
        type: string
        default: generateAlgitesDocsSite
      docs-site-path:
        description: Path to the generated static documentation site.
        required: false
        type: string
        default: docs-site
      java-version:
        description: Java version used for Gradle execution.
        required: false
        type: string
        default: "21"
      publication-kind:
        description: Documentation publication kind.
        required: false
        type: string
        default: preview
      publication-id:
        description: Documentation publication identifier. Defaults to the checked out branch/tag name.
        required: false
        type: string
        default: ""
      gradle-arguments:
        description: Additional Gradle arguments.
        required: false
        type: string
        default: ""
      publish-pages:
        description: Whether to deploy the generated documentation to GitHub Pages.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ALGITES_DOCS_DEFAULT_REF: ${{ github.head_ref || github.ref_name }}

concurrency:
  group: algites-docs-pages-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-docs:
    name: Generate documentation
    runs-on: ubuntu-latest

    steps:
      - name: Resolve documentation publication parameters
        id: publication
        shell: bash
        run: |
          set -euo pipefail

          locSourceRef="${{ inputs.source-ref }}"
          if [[ -z "${locSourceRef}" ]]; then
            locSourceRef="${ALGITES_DOCS_DEFAULT_REF}"
          fi

          locPublicationId="${{ inputs.publication-id }}"
          if [[ -z "${locPublicationId}" ]]; then
            locPublicationId="${locSourceRef}"
          fi

          echo "source-ref=${locSourceRef}" >> "${GITHUB_OUTPUT}"
          echo "publication-kind=${{ inputs.publication-kind }}" >> "${GITHUB_OUTPUT}"
          echo "publication-id=${locPublicationId}" >> "${GITHUB_OUTPUT}"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.publication.outputs.source-ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate documentation site
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon \
            ${{ inputs.gradle-task }} \
            -Palgites.docs.publicationKind="${{ steps.publication.outputs.publication-kind }}" \
            -Palgites.docs.publicationId="${{ steps.publication.outputs.publication-id }}" \
            ${{ inputs.gradle-arguments }}

      - name: Upload documentation site as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: algites-docs-site
          path: ${{ inputs.docs-site-path }}
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: ${{ inputs.publish-pages }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.publish-pages }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.docs-site-path }}

  deploy-pages:
    name: Deploy GitHub Pages
    if: ${{ inputs.publish-pages }}
    needs: generate-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

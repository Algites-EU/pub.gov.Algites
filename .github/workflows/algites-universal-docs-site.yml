name: Generate and publish Algites documentation site

on:
  workflow_call:
    inputs:
      source-ref:
        description: Branch, tag, or commit to check out. Defaults to the calling workflow ref.
        required: false
        type: string
        default: ""
      gradle-task:
        description: Gradle task that generates the documentation site.
        required: false
        type: string
        default: generateAlgitesDocsSite
      java-version:
        description: Java version used for Gradle execution.
        required: false
        type: string
        default: "21"
      publication-kind:
        description: "Documentation publication kind: preview, snapshot, or release."
        required: false
        type: string
        default: preview
      publication-id:
        description: Documentation publication identifier. Defaults to the checked out branch/tag name.
        required: false
        type: string
        default: ""
      documentation-branch:
        description: Branch that stores the persistent generated documentation site.
        required: false
        type: string
        default: documentation
      publication-target:
        description: "Optional publication target list. Empty means: pub.* repositories publish to github-pages; priv.* repositories only update documentation-branch. Currently supported value: github-pages."
        required: false
        type: string
        default: ""
      gradle-arguments:
        description: Additional Gradle arguments.
        required: false
        type: string
        default: ""
      publish-pages:
        description: Deprecated compatibility switch. If false, GitHub Pages publication is disabled even when publication-target resolves to github-pages.
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ALGITES_DOCS_DEFAULT_REF: ${{ github.head_ref || github.ref_name }}

concurrency:
  group: algites-docs-pages-${{ github.repository }}-${{ inputs.documentation-branch }}
  cancel-in-progress: false

jobs:
  generate-and-publish-docs:
    name: Generate and publish documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Resolve documentation publication parameters
        id: publication
        shell: bash
        run: |
          set -euo pipefail

          locSourceRef="${{ inputs.source-ref }}"
          if [[ -z "${locSourceRef}" ]]; then
            locSourceRef="${ALGITES_DOCS_DEFAULT_REF}"
          fi

          locPublicationId="${{ inputs.publication-id }}"
          if [[ -z "${locPublicationId}" ]]; then
            locPublicationId="${locSourceRef}"
          fi

          locDocumentationBranch="${{ inputs.documentation-branch }}"
          if [[ -z "${locDocumentationBranch}" ]]; then
            locDocumentationBranch="documentation"
          fi

          locPublicationTarget="${{ inputs.publication-target }}"
          if [[ -z "${locPublicationTarget}" ]]; then
            locRepositoryName="${GITHUB_REPOSITORY#*/}"
            if [[ "${locRepositoryName}" == pub.* ]]; then
              locPublicationTarget="github-pages"
            else
              locPublicationTarget=""
            fi
          fi

          locPublishGitHubPages="false"
          if [[ "${{ inputs.publish-pages }}" == "true" ]]; then
            IFS=',' read -ra locPublicationTargets <<< "${locPublicationTarget}"
            for locSinglePublicationTarget in "${locPublicationTargets[@]}"; do
              locSinglePublicationTarget="$(echo "${locSinglePublicationTarget}" | xargs)"
              if [[ "${locSinglePublicationTarget}" == "github-pages" ]]; then
                locPublishGitHubPages="true"
              fi
            done
          fi

          echo "source-ref=${locSourceRef}" >> "${GITHUB_OUTPUT}"
          echo "publication-kind=${{ inputs.publication-kind }}" >> "${GITHUB_OUTPUT}"
          echo "publication-id=${locPublicationId}" >> "${GITHUB_OUTPUT}"
          echo "documentation-branch=${locDocumentationBranch}" >> "${GITHUB_OUTPUT}"
          echo "publication-target=${locPublicationTarget}" >> "${GITHUB_OUTPUT}"
          echo "publish-github-pages=${locPublishGitHubPages}" >> "${GITHUB_OUTPUT}"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.publication.outputs.source-ref }}
          path: source

      - name: Prepare persistent documentation branch workspace
        shell: bash
        run: |
          set -euo pipefail

          locDocumentationBranch="${{ steps.publication.outputs.documentation-branch }}"

          mkdir -p documentation-branch
          cd documentation-branch

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads origin "${locDocumentationBranch}" >/dev/null 2>&1; then
            git fetch --depth=1 origin "${locDocumentationBranch}"
            git checkout "${locDocumentationBranch}"
          else
            git checkout --orphan "${locDocumentationBranch}"
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize documentation site"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate documentation site into persistent documentation branch workspace
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon \
            ${{ inputs.gradle-task }} \
            -Palgites.docs.siteRoot="../documentation-branch" \
            -Palgites.docs.publicationKind="${{ steps.publication.outputs.publication-kind }}" \
            -Palgites.docs.publicationId="${{ steps.publication.outputs.publication-id }}" \
            ${{ inputs.gradle-arguments }}

      - name: Commit generated documentation to documentation branch
        working-directory: documentation-branch
        shell: bash
        run: |
          set -euo pipefail

          locDocumentationBranch="${{ steps.publication.outputs.documentation-branch }}"

          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "No documentation changes to persist."
            exit 0
          fi

          git commit -m "Publish documentation for ${{ steps.publication.outputs.publication-kind }}/${{ steps.publication.outputs.publication-id }}"
          git push origin HEAD:"${locDocumentationBranch}"

      - name: Upload documentation site as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: algites-docs-site
          path: documentation-branch
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: ${{ steps.publication.outputs.publish-github-pages == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ steps.publication.outputs.publish-github-pages == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation-branch

      - name: Deploy GitHub Pages
        if: ${{ steps.publication.outputs.publish-github-pages == 'true' }}
        id: deploy-pages
        uses: actions/deploy-pages@v4

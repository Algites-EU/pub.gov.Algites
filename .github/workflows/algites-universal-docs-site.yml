name: Generate and publish Algites documentation site

on:
  workflow_call:
    inputs:
      automation-request:
        description: "Optional opaque JSON request from the stable per-repository automation bridge. When present, known request fields override the typed inputs below; unknown fields are ignored for forward compatibility."
        required: false
        type: string
        default: ""
      source-ref:
        description: Branch, tag, or commit to check out. Defaults to the calling workflow ref.
        required: false
        type: string
        default: ""
      gradle-task:
        description: Gradle task that generates the documentation site.
        required: false
        type: string
        default: generateModustroDocsSite
      java-version:
        description: Java version used for Gradle execution.
        required: false
        type: string
        default: "21"
      python-version:
        description: Python version used for Python documentation tooling.
        required: false
        type: string
        default: "3.14"
      technology-kinds:
        description: "Optional comma-separated TechnologyKinds to document. Empty means all declared TechnologyKinds."
        required: false
        type: string
        default: ""
      publication-kind:
        description: "Documentation publication kind: preview, snapshot, or release."
        required: false
        type: string
        default: preview
      publication-id:
        description: Documentation publication identifier. Defaults to the checked out branch/tag name.
        required: false
        type: string
        default: ""
      snapshot-instance-id:
        description: "Optional immutable decimal snapshot instance id used by timestamped Python development versions."
        required: false
        type: string
        default: ""
      documentation-branch:
        description: Branch that stores the persistent generated documentation site.
        required: false
        type: string
        default: documentation
      publication-target:
        description: "Optional publication target list. Empty means: pub.* repositories publish to github-pages; priv.* repositories only update documentation-branch. Currently supported value: github-pages."
        required: false
        type: string
        default: ""
      gradle-arguments:
        description: Additional Gradle arguments.
        required: false
        type: string
        default: ""
      drop-gradle-cache:
        description: Drop restored Gradle cache state and force dependency refresh for this documentation build.
        required: false
        type: boolean
        default: false
      publish-pages:
        description: Deprecated compatibility switch. If false, GitHub Pages publication is disabled even when publication-target resolves to github-pages.
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  _TMP_ALGITES_DOCS_DEFAULT_REF: ${{ github.head_ref || github.ref_name }}

concurrency:
  group: algites-docs-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate-and-publish-docs:
    name: Generate and publish documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Resolve documentation request
        id: request
        shell: bash
        env:
          AUTOMATION_REQUEST: ${{ inputs.automation-request }}
          INPUT_SOURCE_REF: ${{ inputs.source-ref }}
          INPUT_GRADLE_TASK: ${{ inputs.gradle-task }}
          INPUT_JAVA_VERSION: ${{ inputs.java-version }}
          INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
          INPUT_TECHNOLOGY_KINDS: ${{ inputs.technology-kinds }}
          INPUT_PUBLICATION_KIND: ${{ inputs.publication-kind }}
          INPUT_PUBLICATION_ID: ${{ inputs.publication-id }}
          INPUT_SNAPSHOT_INSTANCE_ID: ${{ inputs.snapshot-instance-id }}
          INPUT_DOCUMENTATION_BRANCH: ${{ inputs.documentation-branch }}
          INPUT_PUBLICATION_TARGET: ${{ inputs.publication-target }}
          INPUT_GRADLE_ARGUMENTS: ${{ inputs.gradle-arguments }}
          INPUT_DROP_GRADLE_CACHE: ${{ inputs.drop-gradle-cache }}
          INPUT_PUBLISH_PAGES: ${{ inputs.publish-pages }}
        run: |
          set -euo pipefail

          locRequest="${AUTOMATION_REQUEST}"
          if [[ -n "${locRequest}" ]]; then
            if ! jq -e 'type == "object"' >/dev/null <<< "${locRequest}"; then
              echo "::error::Algites documentation automation request must be a JSON object."
              exit 1
            fi
          else
            locRequest='{}'
          fi

          resolve_string() {
            local locJsonKey="$1"
            local locFallback="$2"
            local locValue
            locValue="$(jq -r --arg key "${locJsonKey}" '.[$key] // empty | if type == "string" then . else tostring end' <<< "${locRequest}")"
            if [[ -z "${locValue}" ]]; then
              locValue="${locFallback}"
            fi
            printf '%s' "${locValue}"
          }

          locSourceRef="$(resolve_string sourceRef "${INPUT_SOURCE_REF}")"
          locGradleTask="$(resolve_string gradleTask "${INPUT_GRADLE_TASK}")"
          locJavaVersion="$(resolve_string javaVersion "${INPUT_JAVA_VERSION}")"
          locPythonVersion="$(resolve_string pythonVersion "${INPUT_PYTHON_VERSION}")"
          locTechnologyKinds="$(resolve_string technologyKinds "${INPUT_TECHNOLOGY_KINDS}")"
          locPublicationKind="$(resolve_string publicationKind "${INPUT_PUBLICATION_KIND}")"
          locPublicationId="$(resolve_string publicationId "${INPUT_PUBLICATION_ID}")"
          locSnapshotInstanceId="$(resolve_string snapshotInstanceId "${INPUT_SNAPSHOT_INSTANCE_ID}")"
          locDocumentationBranch="$(resolve_string documentationBranch "${INPUT_DOCUMENTATION_BRANCH}")"
          locPublicationTarget="$(resolve_string publicationTarget "${INPUT_PUBLICATION_TARGET}")"
          locGradleArguments="$(resolve_string gradleArguments "${INPUT_GRADLE_ARGUMENTS}")"
          locDropGradleCache="$(jq -r '.dropGradleCache // empty | if type == "boolean" then tostring elif type == "string" then . else tostring end' <<< "${locRequest}")"
          if [[ -z "${locDropGradleCache}" ]]; then
            locDropGradleCache="${INPUT_DROP_GRADLE_CACHE}"
          fi
          case "${locDropGradleCache,,}" in
            true|false) ;;
            *) echo "::error::dropGradleCache must resolve to true or false, got '${locDropGradleCache}'."; exit 1 ;;
          esac

          # Snapshot overrides travel in the generic automation request; omitted fields use descriptors.
          if ! jq -e '.publishingOverrides == null or (.publishingOverrides | type == "object")' >/dev/null <<< "${locRequest}"; then
            echo "::error::publishingOverrides must be a JSON object."
            exit 1
          fi
          locArgumentsFile="${RUNNER_TEMP}/modustro-publishing-arguments.txt"
          : > "${locArgumentsFile}"
          locOverride="$(jq -r '.publishingOverrides.native_binary_output // "DEFAULT"' <<< "${locRequest}")"
          case "${locOverride}" in
            DEFAULT|FORCE_ON|FORCE_OFF) ;;
            *) echo "::error::publishingOverrides.native_binary_output must be DEFAULT, FORCE_ON, or FORCE_OFF."; exit 1 ;;
          esac
          if [[ "${locPublicationKind}" == "release" && "${locOverride}" != "DEFAULT" ]]; then
            echo "::error::Release publishing does not permit snapshot publishing overrides."
            exit 1
          fi
          echo "MODUSTRO_PUBLISHING_NATIVE_BINARY_OUTPUT=${locOverride}" >> "${GITHUB_ENV}"
          printf '%s\n' "-Pmodustro.publishing.nativeBinaryOutput=${locOverride}" >> "${locArgumentsFile}"
          locOverride="$(jq -r '.publishingOverrides.native_source_output // "DEFAULT"' <<< "${locRequest}")"
          case "${locOverride}" in
            DEFAULT|FORCE_ON|FORCE_OFF) ;;
            *) echo "::error::publishingOverrides.native_source_output must be DEFAULT, FORCE_ON, or FORCE_OFF."; exit 1 ;;
          esac
          if [[ "${locPublicationKind}" == "release" && "${locOverride}" != "DEFAULT" ]]; then
            echo "::error::Release publishing does not permit snapshot publishing overrides."
            exit 1
          fi
          echo "MODUSTRO_PUBLISHING_NATIVE_SOURCE_OUTPUT=${locOverride}" >> "${GITHUB_ENV}"
          printf '%s\n' "-Pmodustro.publishing.nativeSourceOutput=${locOverride}" >> "${locArgumentsFile}"
          locOverride="$(jq -r '.publishingOverrides.native_documentation_output // "DEFAULT"' <<< "${locRequest}")"
          case "${locOverride}" in
            DEFAULT|FORCE_ON|FORCE_OFF) ;;
            *) echo "::error::publishingOverrides.native_documentation_output must be DEFAULT, FORCE_ON, or FORCE_OFF."; exit 1 ;;
          esac
          if [[ "${locPublicationKind}" == "release" && "${locOverride}" != "DEFAULT" ]]; then
            echo "::error::Release publishing does not permit snapshot publishing overrides."
            exit 1
          fi
          echo "MODUSTRO_PUBLISHING_NATIVE_DOCUMENTATION_OUTPUT=${locOverride}" >> "${GITHUB_ENV}"
          printf '%s\n' "-Pmodustro.publishing.nativeDocumentationOutput=${locOverride}" >> "${locArgumentsFile}"
          locOverride="$(jq -r '.publishingOverrides.modustro_docs_site // "DEFAULT"' <<< "${locRequest}")"
          case "${locOverride}" in
            DEFAULT|FORCE_ON|FORCE_OFF) ;;
            *) echo "::error::publishingOverrides.modustro_docs_site must be DEFAULT, FORCE_ON, or FORCE_OFF."; exit 1 ;;
          esac
          if [[ "${locPublicationKind}" == "release" && "${locOverride}" != "DEFAULT" ]]; then
            echo "::error::Release publishing does not permit snapshot publishing overrides."
            exit 1
          fi
          echo "MODUSTRO_PUBLISHING_MODUSTRO_DOCS_SITE=${locOverride}" >> "${GITHUB_ENV}"
          printf '%s\n' "-Pmodustro.publishing.modustroDocsSite=${locOverride}" >> "${locArgumentsFile}"
          locOverride="$(jq -r '.publishingOverrides.schema_site // "DEFAULT"' <<< "${locRequest}")"
          case "${locOverride}" in
            DEFAULT|FORCE_ON|FORCE_OFF) ;;
            *) echo "::error::publishingOverrides.schema_site must be DEFAULT, FORCE_ON, or FORCE_OFF."; exit 1 ;;
          esac
          if [[ "${locPublicationKind}" == "release" && "${locOverride}" != "DEFAULT" ]]; then
            echo "::error::Release publishing does not permit snapshot publishing overrides."
            exit 1
          fi
          echo "MODUSTRO_PUBLISHING_SCHEMA_SITE=${locOverride}" >> "${GITHUB_ENV}"
          printf '%s\n' "-Pmodustro.publishing.schemaSite=${locOverride}" >> "${locArgumentsFile}"
          echo "MODUSTRO_PUBLISHING_ARGUMENTS_FILE=${locArgumentsFile}" >> "${GITHUB_ENV}"

          locPublishPages="$(jq -r '.publishPages // empty | if type == "boolean" then tostring elif type == "string" then . else tostring end' <<< "${locRequest}")"
          if [[ -z "${locPublishPages}" ]]; then
            locPublishPages="${INPUT_PUBLISH_PAGES}"
          fi
          case "${locPublishPages,,}" in
            true|false) ;;
            *) echo "::error::publishPages must resolve to true or false, got '${locPublishPages}'."; exit 1 ;;
          esac

          {
            echo "source-ref=${locSourceRef}"
            echo "gradle-task=${locGradleTask}"
            echo "java-version=${locJavaVersion}"
            echo "python-version=${locPythonVersion}"
            echo "technology-kinds=${locTechnologyKinds}"
            echo "publication-kind=${locPublicationKind}"
            echo "publication-id=${locPublicationId}"
            echo "snapshot-instance-id=${locSnapshotInstanceId}"
            echo "documentation-branch=${locDocumentationBranch}"
            echo "publication-target=${locPublicationTarget}"
            echo "gradle-arguments=${locGradleArguments}"
            echo "drop-gradle-cache=${locDropGradleCache,,}"
            echo "publish-pages=${locPublishPages,,}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve documentation source parameters
        id: source-parameters
        shell: bash
        run: |
          set -euo pipefail

          locSourceRef="${{ steps.request.outputs.source-ref }}"
          if [[ -z "${locSourceRef}" ]]; then
            locSourceRef="${_TMP_ALGITES_DOCS_DEFAULT_REF}"
          fi

          echo "source-ref=${locSourceRef}" >> "${GITHUB_OUTPUT}"

      - name: Resolve documentation publishing parameters
        id: publication
        shell: bash
        run: |
          set -euo pipefail

          locDocumentationBranch="${{ steps.request.outputs.documentation-branch }}"
          if [[ -z "${locDocumentationBranch}" ]]; then
            locDocumentationBranch="documentation"
          fi

          locPublicationTarget="${{ steps.request.outputs.publication-target }}"
          if [[ -z "${locPublicationTarget}" ]]; then
            locRepositoryName="${GITHUB_REPOSITORY#*/}"
            if [[ "${locRepositoryName}" == pub.* ]]; then
              locPublicationTarget="github-pages"
            else
              locPublicationTarget=""
            fi
          fi

          locPublishGitHubPages="false"
          if [[ "${{ steps.request.outputs.publish-pages }}" == "true" ]]; then
            IFS=',' read -ra locPublicationTargets <<< "${locPublicationTarget}"
            for locSinglePublicationTarget in "${locPublicationTargets[@]}"; do
              locSinglePublicationTarget="$(echo "${locSinglePublicationTarget}" | xargs)"
              if [[ "${locSinglePublicationTarget}" == "github-pages" ]]; then
                locPublishGitHubPages="true"
              fi
            done
          fi

          echo "publication-kind=${{ steps.request.outputs.publication-kind }}" >> "${GITHUB_OUTPUT}"
          echo "documentation-branch=${locDocumentationBranch}" >> "${GITHUB_OUTPUT}"
          echo "publication-target=${locPublicationTarget}" >> "${GITHUB_OUTPUT}"
          echo "publish-github-pages=${locPublishGitHubPages}" >> "${GITHUB_OUTPUT}"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.source-parameters.outputs.source-ref }}
          path: source
          fetch-depth: 0

      - name: Fetch Algites public download repository defaults
        shell: bash
        run: |
          set -euo pipefail
          locDefaultsDir="${RUNNER_TEMP}/algites-governance-defaults"
          locPublicDownloadFile="${locDefaultsDir}/algites-repository-download-defaults-public.yml"
          mkdir -p "${locDefaultsDir}"
          curl -fsSL \
            "https://raw.githubusercontent.com/Algites-EU/pub.gov.Algites/main/repository/defaults/algites-repository-download-defaults-public.yml" \
            > "${locPublicDownloadFile}"
          echo "ALGITES_REPOSITORY_PUBLIC_DEFAULTS_FILE=${locPublicDownloadFile}" >> "${GITHUB_ENV}"

      - name: Create private governance read token
        id: governance_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PRIVATE_GOVERNANCE_GITHUB_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GOVERNANCE_GITHUB_APP_PEM }}
          owner: Algites-EU
          repositories: priv.gov.Algites
          permission-contents: read

      - name: Fetch Algites governed publication defaults
        shell: bash
        env:
          GH_TOKEN: ${{ steps.governance_token.outputs.token }}
        run: |
          set -euo pipefail
          locDefaultsDir="${RUNNER_TEMP}/algites-governance-defaults"
          mkdir -p "${locDefaultsDir}"
          locRepositoryName="${GITHUB_REPOSITORY#*/}"

          if [[ "${locRepositoryName}" == pub.* ]]; then
            locGovernedPublicFile="${locDefaultsDir}/algites-repository-governed-defaults-public.yml"
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/Algites-EU/priv.gov.Algites/contents/repository/defaults/algites-repository-governed-defaults-public.yml?ref=main" \
              > "${locGovernedPublicFile}"
            echo "ALGITES_REPOSITORY_GOVERNED_PUBLIC_DEFAULTS_FILE=${locGovernedPublicFile}" >> "${GITHUB_ENV}"
          elif [[ "${locRepositoryName}" == priv.* ]]; then
            locPrivateFile="${locDefaultsDir}/algites-repository-defaults-private.yml"
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/Algites-EU/priv.gov.Algites/contents/repository/defaults/algites-repository-defaults-private.yml?ref=main" \
              > "${locPrivateFile}"
            echo "ALGITES_REPOSITORY_PRIVATE_DEFAULTS_FILE=${locPrivateFile}" >> "${GITHUB_ENV}"
          else
            echo "::error::Unable to infer Algites repository visibility from '${locRepositoryName}'."
            exit 1
          fi

      - name: Fetch Algites public licensing governance
        shell: bash
        run: |
          set -euo pipefail
          locGovernanceRoot="${RUNNER_TEMP}/algites-public-licensing-governance"
          rm -rf "${locGovernanceRoot}"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/Algites-EU/pub.gov.Algites.git \
            "${locGovernanceRoot}"
          git -C "${locGovernanceRoot}" sparse-checkout set licensing
          echo "ALGITES_LICENSING_PUBLIC_GOVERNANCE_DIRECTORY=${locGovernanceRoot}/licensing" >> "${GITHUB_ENV}"

      - name: Show checked out source revision
        id: source-revision
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          locSourceCommit="$(git rev-parse HEAD)"
          locCheckedOutBranch="$(git branch --show-current || true)"
          locGeneratedAt="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Requested source ref: ${{ steps.source-parameters.outputs.source-ref }}"
          echo "Checked out HEAD: ${locSourceCommit}"
          echo "Checked out branch: ${locCheckedOutBranch}"
          echo "Documentation generated at: ${locGeneratedAt}"

          echo "source-commit=${locSourceCommit}" >> "${GITHUB_OUTPUT}"
          echo "generated-at=${locGeneratedAt}" >> "${GITHUB_OUTPUT}"

      - name: Prepare persistent documentation branch workspace
        shell: bash
        run: |
          set -euo pipefail

          locDocumentationBranch="${{ steps.publication.outputs.documentation-branch }}"

          mkdir -p documentation-branch
          cd documentation-branch

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads origin "${locDocumentationBranch}" >/dev/null 2>&1; then
            git fetch --depth=1 origin "${locDocumentationBranch}"
            git checkout "${locDocumentationBranch}"
          else
            git checkout --orphan "${locDocumentationBranch}"
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize documentation site"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.request.outputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ steps.request.outputs.drop-gradle-cache == 'true' }}

      - name: Drop Gradle cache
        if: ${{ steps.request.outputs.drop-gradle-cache == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          locGradleUserHome="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          echo "Dropping Gradle cache at ${locGradleUserHome}/caches and forcing dependency refresh."
          rm -rf "${locGradleUserHome}/caches"
          echo "ALGITES_GRADLE_REFRESH_ARGUMENT=--refresh-dependencies" >> "${GITHUB_ENV}"

      - name: Resolve Algites artifact metadata
        id: algites-artifact-metadata
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t locPublishingArgs < "${MODUSTRO_PUBLISHING_ARGUMENTS_FILE}"

          locResolverProjectDir="${RUNNER_TEMP}/algites-resolve-artifact-metadata-project"
          locResolvedPropertiesFile="${RUNNER_TEMP}/algites-resolved-artifact-metadata.properties"

          rm -rf "${locResolverProjectDir}"
          mkdir -p "${locResolverProjectDir}"

          locBootstrapTemplate="${PWD}/gradle/tool/repository/modustro-bootstrap-settings.template.gradle.kts"
          if [[ -f "${locBootstrapTemplate}" ]]; then
            cp "${locBootstrapTemplate}" "${locResolverProjectDir}/settings.gradle.kts"
          else
            curl -fsSL \
              "https://raw.githubusercontent.com/Algites-EU/pub.gov.Algites/main/gradle/tool/repository/modustro-bootstrap-settings.template.gradle.kts" \
              > "${locResolverProjectDir}/settings.gradle.kts"
          fi
          echo 'modustro.gradleinit.metadataOnly=true' > "${locResolverProjectDir}/gradle.properties"
          echo 'rootProject.name = "algites-resolve-artifact-metadata"' >> "${locResolverProjectDir}/settings.gradle.kts"

          cat > "${locResolverProjectDir}/build.gradle.kts" <<'KTS'
          import java.io.File

          val locRepositoryDirectory = File(System.getenv("_TMP_ALGITES_METADATA_REPOSITORY_DIR"))
          tasks.register("writeAlgitesResolvedArtifactMetadataProperties") {
              group = "algites"
              description = "Writes resolved Algites artifact metadata properties for GitHub Actions."

              doLast {
                  @Suppress("UNCHECKED_CAST")
                  val locResolveMetadataMap = rootProject.extra["modustroResolveArtifactDirectoryMetadataMap"] as (
                      File,
                      String?,
                      String?,
                      String?,
                      String?
                  ) -> Map<String, Any?>

                  @Suppress("UNCHECKED_CAST")
                  val locFlattenMetadata = rootProject.extra["modustroFlattenArtifactDirectoryMetadata"] as (Map<String, Any?>) -> Map<String, String>

                  val locMetadata = locResolveMetadataMap(
                      locRepositoryDirectory,
                      "",
                      "current-with-subdirs",
                      providers.gradleProperty("repository.name").orNull,
                      providers.gradleProperty("repository.visibility").orNull
                  )
                  val locProperties = locFlattenMetadata(locMetadata)
                  val locOutputFile = File(System.getenv("_TMP_ALGITES_RESOLVED_PROPERTIES_FILE"))

                  locOutputFile.parentFile.mkdirs()
                  locOutputFile.writeText(
                      locProperties.entries
                          .sortedBy { it.key }
                          .joinToString(System.lineSeparator()) { locEntry ->
                              "${locEntry.key}=${locEntry.value}"
                          } + System.lineSeparator(),
                      Charsets.UTF_8
                  )
              }
          }
          KTS

          _TMP_ALGITES_METADATA_REPOSITORY_DIR="${PWD}" _TMP_ALGITES_RESOLVED_PROPERTIES_FILE="${locResolvedPropertiesFile}" ./gradlew --no-daemon "${locPublishingArgs[@]}" ${ALGITES_GRADLE_REFRESH_ARGUMENT:-} --quiet --project-dir "${locResolverProjectDir}" writeAlgitesResolvedArtifactMetadataProperties

          locResolvedVersion="$(grep -m 1 '^artifactDirectories\.0\.version\.resolvedValue=' "${locResolvedPropertiesFile}" | cut -d= -f2- || true)"
          locResolvedLane="$(grep -m 1 '^artifactDirectories\.0\.version\.lane=' "${locResolvedPropertiesFile}" | cut -d= -f2- || true)"
          locResolvedRevision="$(grep -m 1 '^artifactDirectories\.0\.version\.revision=' "${locResolvedPropertiesFile}" | cut -d= -f2- || true)"
          locResolvedQualifierKind="$(grep -m 1 '^artifactDirectories\.0\.version\.qualifierKind=' "${locResolvedPropertiesFile}" | cut -d= -f2- || true)"

          echo "version-lane=${locResolvedLane}" >> "${GITHUB_OUTPUT}"
          echo "version-revision=${locResolvedRevision}" >> "${GITHUB_OUTPUT}"
          echo "version-qualifier-kind=${locResolvedQualifierKind}" >> "${GITHUB_OUTPUT}"
          echo "version-resolved-value=${locResolvedVersion}" >> "${GITHUB_OUTPUT}"

          locDeclaredKinds="$(
            grep -E '^artifactDirectories\.[0-9]+\.technologyKinds=' "${locResolvedPropertiesFile}" \
              | cut -d= -f2- \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | tr '[:upper:]' '[:lower:]' \
              | grep -v '^$' \
              | sort -u \
              | paste -sd, - || true
          )"
          locRequestedKinds="${{ steps.request.outputs.technology-kinds }}"
          locRequestedKinds="$(
            printf '%s' "${locRequestedKinds}" \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | tr '[:upper:]' '[:lower:]' \
              | grep -v '^$' \
              | sort -u \
              | paste -sd, - || true
          )"

          if [[ -n "${locRequestedKinds}" ]]; then
            while IFS= read -r locKind; do
              [[ -z "${locKind}" ]] && continue
              case "${locKind}" in
                java|python|mps) ;;
                *) echo "::error::Unsupported documentation TechnologyKind: ${locKind}"; exit 1 ;;
              esac
            done < <(tr ',' '\n' <<< "${locRequestedKinds}")

            locEffectiveKinds="$(
              comm -12 \
                <(tr ',' '\n' <<< "${locDeclaredKinds}" | grep -v '^$' | sort -u) \
                <(tr ',' '\n' <<< "${locRequestedKinds}" | grep -v '^$' | sort -u) \
                | paste -sd, - || true
            )"
          else
            locEffectiveKinds="${locDeclaredKinds}"
          fi

          echo "declared-technology-kinds=${locDeclaredKinds}" >> "${GITHUB_OUTPUT}"
          echo "requested-technology-kinds=${locRequestedKinds}" >> "${GITHUB_OUTPUT}"
          echo "documentation-technology-kinds=${locEffectiveKinds}" >> "${GITHUB_OUTPUT}"
          echo "Documentation TechnologyKinds: declared=${locDeclaredKinds:-<none>} requested=${locRequestedKinds:-<all declared>} effective=${locEffectiveKinds:-<none>}"

      - name: Resolve effective documentation publication id
        id: effective-publication
        shell: bash
        run: |
          set -euo pipefail

          locPublicationId="${{ steps.request.outputs.publication-id }}"
          if [[ -z "${locPublicationId}" ]]; then
            locPublicationId="${{ steps.algites-artifact-metadata.outputs.version-resolved-value }}"
          fi
          if [[ -z "${locPublicationId}" || "${locPublicationId}" == "null" ]]; then
            locPublicationId="${{ steps.source-parameters.outputs.source-ref }}"
          fi

          echo "publication-id=${locPublicationId}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python documentation toolchain
        if: ${{ contains(format(',{0},', steps.algites-artifact-metadata.outputs.documentation-technology-kinds), ',python,') }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.request.outputs.python-version }}

      - name: Install Python documentation tooling
        if: ${{ contains(format(',{0},', steps.algites-artifact-metadata.outputs.documentation-technology-kinds), ',python,') }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "Sphinx==9.1.0" \
            "sphinx-autoapi==3.8.0"

      - name: Generate documentation site into persistent documentation branch workspace
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t locPublishingArgs < "${MODUSTRO_PUBLISHING_ARGUMENTS_FILE}"

          ./gradlew --no-daemon ${ALGITES_GRADLE_REFRESH_ARGUMENT:-} \
            ${{ steps.request.outputs.gradle-task }} \
            -Pmodustro.docs.siteRoot="${GITHUB_WORKSPACE}/documentation-branch" \
            -Pmodustro.docs.publicationKind="${{ steps.publication.outputs.publication-kind }}" \
            -Pmodustro.docs.publicationId="${{ steps.effective-publication.outputs.publication-id }}" \
            -Pmodustro.docs.sourceRef="${{ steps.source-parameters.outputs.source-ref }}" \
            -Pmodustro.docs.sourceCommit="${{ steps.source-revision.outputs.source-commit }}" \
            -Pmodustro.docs.generatedAt="${{ steps.source-revision.outputs.generated-at }}" \
            -Palgites.snapshot.instanceId="${{ steps.request.outputs.snapshot-instance-id }}" \
            -Palgites.technologyKinds="${{ steps.request.outputs.technology-kinds }}" \
            ${{ steps.request.outputs.gradle-arguments }} \
            "${locPublishingArgs[@]}"

      - name: Resolve effective documentation publishing policy
        id: docs_publishing_policy
        shell: bash
        run: |
          set -euo pipefail
          locSelection="${GITHUB_WORKSPACE}/documentation-branch/.modustro-publishing/docs-site.properties"
          if [[ ! -f "${locSelection}" ]]; then
            echo "::error::Generated Modustro documentation publishing selection is missing: ${locSelection}"
            exit 1
          fi
          locEnabled="$(sed -n 's/^publishingEnabled=//p' "${locSelection}")"
          case "${locEnabled}" in
            true|false) ;;
            *) echo "::error::Invalid effective documentation PublishingEnabled: ${locEnabled}"; exit 1 ;;
          esac
          echo "publishing_enabled=${locEnabled}" >> "${GITHUB_OUTPUT}"

      - name: Publish documentation through Modustro Builder
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t locPublishingArgs < "${MODUSTRO_PUBLISHING_ARGUMENTS_FILE}"

          ./gradlew --no-daemon ${ALGITES_GRADLE_REFRESH_ARGUMENT:-} \
            publishModustroDocsSite \
            -Pmodustro.docs.siteRoot="${GITHUB_WORKSPACE}/documentation-branch" \
            -Pmodustro.docs.publicationKind="${{ steps.publication.outputs.publication-kind }}" \
            -Pmodustro.docs.publicationId="${{ steps.effective-publication.outputs.publication-id }}" \
            -Pmodustro.docs.publishingBranch="${{ steps.publication.outputs.documentation-branch }}" \
            -Pmodustro.docs.sourceRef="${{ steps.source-parameters.outputs.source-ref }}" \
            -Pmodustro.docs.sourceCommit="${{ steps.source-revision.outputs.source-commit }}" \
            -Pmodustro.docs.generatedAt="${{ steps.source-revision.outputs.generated-at }}" \
            -Palgites.snapshot.instanceId="${{ steps.request.outputs.snapshot-instance-id }}" \
            -Palgites.technologyKinds="${{ steps.request.outputs.technology-kinds }}" \
            ${{ steps.request.outputs.gradle-arguments }} \
            "${locPublishingArgs[@]}"

      - name: Upload documentation site as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: algites-docs-site
          path: documentation-branch
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: ${{ steps.publication.outputs.publish-github-pages == 'true' && steps.docs_publishing_policy.outputs.publishing_enabled == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ steps.publication.outputs.publish-github-pages == 'true' && steps.docs_publishing_policy.outputs.publishing_enabled == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation-branch

      - name: Deploy GitHub Pages
        if: ${{ steps.publication.outputs.publish-github-pages == 'true' && steps.docs_publishing_policy.outputs.publishing_enabled == 'true' }}
        id: deploy-pages
        uses: actions/deploy-pages@v4

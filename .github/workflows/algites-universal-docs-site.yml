name: Generate and publish Algites documentation site

on:
  workflow_call:
    inputs:
      source-ref:
        description: Branch, tag, or commit to check out. Defaults to the calling workflow ref.
        required: false
        type: string
        default: ""
      gradle-task:
        description: Gradle task that generates the documentation site.
        required: false
        type: string
        default: generateAlgitesDocsSite
      java-version:
        description: Java version used for Gradle execution.
        required: false
        type: string
        default: "21"
      publication-kind:
        description: "Documentation publication kind: preview, snapshot, or release."
        required: false
        type: string
        default: preview
      publication-id:
        description: Documentation publication identifier. Defaults to the checked out branch/tag name.
        required: false
        type: string
        default: ""
      pages-branch:
        description: Branch that stores the persistent generated documentation site.
        required: false
        type: string
        default: gh-pages
      gradle-arguments:
        description: Additional Gradle arguments.
        required: false
        type: string
        default: ""
      publish-pages:
        description: Whether to persist and deploy the generated documentation to GitHub Pages.
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ALGITES_DOCS_DEFAULT_REF: ${{ github.head_ref || github.ref_name }}

concurrency:
  group: algites-docs-pages-${{ github.repository }}-${{ inputs.pages-branch }}
  cancel-in-progress: false

jobs:
  generate-and-publish-docs:
    name: Generate and publish documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Resolve documentation publication parameters
        id: publication
        shell: bash
        run: |
          set -euo pipefail

          locSourceRef="${{ inputs.source-ref }}"
          if [[ -z "${locSourceRef}" ]]; then
            locSourceRef="${ALGITES_DOCS_DEFAULT_REF}"
          fi

          locPublicationId="${{ inputs.publication-id }}"
          if [[ -z "${locPublicationId}" ]]; then
            locPublicationId="${locSourceRef}"
          fi

          echo "source-ref=${locSourceRef}" >> "${GITHUB_OUTPUT}"
          echo "publication-kind=${{ inputs.publication-kind }}" >> "${GITHUB_OUTPUT}"
          echo "publication-id=${locPublicationId}" >> "${GITHUB_OUTPUT}"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.publication.outputs.source-ref }}
          path: source

      - name: Prepare persistent Pages branch workspace
        shell: bash
        run: |
          set -euo pipefail

          locPagesBranch="${{ inputs.pages-branch }}"

          mkdir -p gh-pages
          cd gh-pages

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads origin "${locPagesBranch}" >/dev/null 2>&1; then
            git fetch --depth=1 origin "${locPagesBranch}"
            git checkout "${locPagesBranch}"
          else
            git checkout --orphan "${locPagesBranch}"
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize documentation site"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore existing documentation site into source workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source/docs-site

          rsync -a --delete \
            --exclude '.git/' \
            gh-pages/ \
            source/docs-site/

      - name: Generate documentation site
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon \
            ${{ inputs.gradle-task }} \
            -Palgites.docs.publicationKind="${{ steps.publication.outputs.publication-kind }}" \
            -Palgites.docs.publicationId="${{ steps.publication.outputs.publication-id }}" \
            ${{ inputs.gradle-arguments }}

      - name: Copy generated documentation to persistent Pages workspace
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "source/docs-site" ]]; then
            echo "Generated documentation directory source/docs-site was not found."
            exit 1
          fi

          rsync -a --delete \
            --exclude '.git/' \
            source/docs-site/ \
            gh-pages/

      - name: Commit generated documentation to persistent Pages branch
        if: ${{ inputs.publish-pages }}
        working-directory: gh-pages
        shell: bash
        run: |
          set -euo pipefail

          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "No documentation changes to persist."
            exit 0
          fi

          git commit -m "Publish documentation for ${{ steps.publication.outputs.publication-kind }}/${{ steps.publication.outputs.publication-id }}"
          git push origin HEAD:${{ inputs.pages-branch }}

      - name: Upload documentation site as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: algites-docs-site
          path: gh-pages
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: ${{ inputs.publish-pages }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.publish-pages }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Deploy GitHub Pages
        if: ${{ inputs.publish-pages }}
        id: deploy-pages
        uses: actions/deploy-pages@v4

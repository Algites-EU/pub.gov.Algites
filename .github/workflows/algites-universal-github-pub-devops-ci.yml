name: Algites Universal Public Devops CI

on:
  workflow_call:
    inputs:
      # Optional: override Java version. If empty, it will be auto-detected.
      java-version:
        description: "Java version (e.g. 17, 21). If empty, auto-detect."
        required: false
        type: string
        default: ""

      # Optional: override Gradle tasks
      gradle-approval-task:
        description: "Gradle task to perform the approval: test with packaging and full verification"
        required: false
        type: string
        default: "check"
      gradle-verification-task:
        description: "Gradle task to perform the verification: execution of all tests"
        required: false
        type: string
        default: "test integrationTest"
      gradle-construction-task:
        description: "Gradle task to perform the construction of the artifact: compilation of all classes and test classes (no test executions)"
        required: false
        type: string
        default: "testClasses"

      github-app-enabled:
        type: boolean
        description: "Indication the Github Application for the task is enabled"
        required: false
        default: false

      private-repository-defaults-enabled:
        type: boolean
        description: "Load the combined private Algites repository defaults overlay."
        required: false
        default: false

    secrets:
      GITHUB_APP_ID:
        required: false
      GITHUB_APP_INSTALLATION_ID:
        required: false
      GITHUB_APP_PEM:
        required: false
      PRIVATE_GOVERNANCE_GITHUB_APP_ID:
        required: false
      PRIVATE_GOVERNANCE_GITHUB_APP_PEM:
        required: false
      ALGITES_DEVOPS_BUILD_REPOSITORY_CREDENTIALS:
        description: "Universal Algites credential document JSON. Only credential profiles required by the current operation are materialized and forwarded to Gradle."
        required: false
      _TMP_ALGITES_CREDENTIAL_SECRETS_JSON:
        description: "Serialized GitHub secrets context used only by the trusted Algites credential bridge to resolve secret_content references."
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch Algites public download repository defaults
        shell: bash
        run: |
          set -euo pipefail
          locDefaultsDir="${RUNNER_TEMP}/algites-governance-defaults"
          locPublicDownloadFile="${locDefaultsDir}/algites-repository-download-defaults-public.yml"
          mkdir -p "${locDefaultsDir}"
          curl -fsSL \
            "https://raw.githubusercontent.com/Algites-EU/pub.gov.Algites/main/repository/defaults/algites-repository-download-defaults-public.yml" \
            > "${locPublicDownloadFile}"
          echo "ALGITES_REPOSITORY_PUBLIC_DEFAULTS_FILE=${locPublicDownloadFile}" >> "${GITHUB_ENV}"

      - name: Create private governance read token
        id: governance_token
        if: ${{ inputs.private-repository-defaults-enabled }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PRIVATE_GOVERNANCE_GITHUB_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GOVERNANCE_GITHUB_APP_PEM }}
          owner: Algites-EU
          repositories: priv.gov.Algites
          permission-contents: read

      - name: Fetch Algites private repository defaults
        if: ${{ inputs.private-repository-defaults-enabled }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.governance_token.outputs.token }}
        run: |
          set -euo pipefail
          locDefaultsDir="${RUNNER_TEMP}/algites-governance-defaults"
          locPrivateFile="${locDefaultsDir}/algites-repository-defaults-private.yml"
          mkdir -p "${locDefaultsDir}"

          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/Algites-EU/priv.gov.Algites/contents/repository/defaults/algites-repository-defaults-private.yml?ref=main" \
            > "${locPrivateFile}"

          echo "ALGITES_REPOSITORY_PRIVATE_DEFAULTS_FILE=${locPrivateFile}" >> "${GITHUB_ENV}"

      - name: Fetch Algites licensing governance
        shell: bash
        env:
          GH_TOKEN: ${{ steps.governance_token.outputs.token }}
        run: |
          set -euo pipefail
          locPublicRoot="${RUNNER_TEMP}/algites-public-licensing-governance"
          rm -rf "${locPublicRoot}"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/Algites-EU/pub.gov.Algites.git \
            "${locPublicRoot}"
          git -C "${locPublicRoot}" sparse-checkout set licensing
          echo "ALGITES_LICENSING_PUBLIC_GOVERNANCE_DIRECTORY=${locPublicRoot}/licensing" >> "${GITHUB_ENV}"

          if [[ "${{ inputs.private-repository-defaults-enabled }}" == "true" ]]; then
            locPrivateRoot="${RUNNER_TEMP}/algites-private-licensing-governance"
            rm -rf "${locPrivateRoot}"
            gh repo clone Algites-EU/priv.gov.Algites "${locPrivateRoot}" -- --depth 1 --filter=blob:none --sparse
            git -C "${locPrivateRoot}" sparse-checkout set licensing
            echo "ALGITES_LICENSING_PRIVATE_GOVERNANCE_DIRECTORY=${locPrivateRoot}/licensing" >> "${GITHUB_ENV}"
          fi

      - name: Decide mode by branch
        id: mode
        shell: bash
        run: |
          _TMP_ALGITES_REF="${GITHUB_REF#refs/heads/}"
          echo "Branch: $_TMP_ALGITES_REF"

          # 1) Feature test runs: compile only (no tests, no publish/deploy/install)
          if [[ "$_TMP_ALGITES_REF" == *"/develop" || "$_TMP_ALGITES_REF" == develop ]]; then
            echo "mode=test" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) Feature branches: compile only (no tests, no publish/deploy/install)
          if [[ "$_TMP_ALGITES_REF" == *"/feature/"* || "$_TMP_ALGITES_REF" == feature/* ]]; then
            echo "mode=compile" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3) Lane branches: verify (the lane rules are validated later)
          if [[ "$_TMP_ALGITES_REF" == *"/lane/"* || "$_TMP_ALGITES_REF" == lane/* ]]; then
            echo "mode=verify" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4) Verify branches: main/master/develop/hotfix and also */main, */master, */develop, */hotfix
          if [[ "$_TMP_ALGITES_REF" == "main" || "$_TMP_ALGITES_REF" == "master" || "$_TMP_ALGITES_REF" == "hotfix" || "$_TMP_ALGITES_REF" == */main || "$_TMP_ALGITES_REF" == */master || "$_TMP_ALGITES_REF" == */hotfix ]]; then
            echo "mode=verify" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 5) Everything else: skip
          echo "mode=skip" >> "$GITHUB_OUTPUT"

      - name: Detect config changes (pom/gradle)
        id: changes
        if: ${{ steps.mode.outputs.mode != 'skip' }}
        shell: bash
        run: |
          # For workflow_dispatch (or other events without a "before"), we cannot reliably diff.
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "pom_changed=false" >> "$GITHUB_OUTPUT"
            echo "gradle_changed=false" >> "$GITHUB_OUTPUT"
            echo "note=non-push-event" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # First push to a new branch may have BEFORE=0000...
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            CHANGED="$(git show --name-only --pretty='' "$AFTER" || true)"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" || true)"
          fi

          echo "Changed files:"
          echo "$CHANGED"

          pom_changed=false
          gradle_changed=false

          # POM change patterns
          if echo "$CHANGED" | grep -Eq '(^|/)pom\.xml$|\.pom$'; then
            pom_changed=true
          fi

          # Gradle config change patterns
          if echo "$CHANGED" | grep -Eq '(^|/)build\.gradle(\.kts)?$|(^|/)settings\.gradle(\.kts)?$|(^|/)gradle\.properties$|(^|/)gradlew(\.bat)?$|(^|/)buildSrc/|(^|/)gradle/'; then
            gradle_changed=true
          fi

          echo "pom_changed=$pom_changed"
          echo "gradle_changed=$gradle_changed"
          echo "pom_changed=$pom_changed" >> "$GITHUB_OUTPUT"
          echo "gradle_changed=$gradle_changed" >> "$GITHUB_OUTPUT"

      - name: Extract related GitHub Issues (from branch + commit messages)
        id: issues
        if: ${{ steps.mode.outputs.mode != 'skip' }}
        shell: bash
        run: |
          set -euo pipefail
          _TMP_ALGITES_REF="${GITHUB_REF#refs/heads/}"
          _TMP_ALGITES_ORG="Algites-EU"
          _TMP_ALGITES_REPO="${GITHUB_REPOSITORY}"

          # Collect commit subjects (only subjects are used, not bodies)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              _TMP_ALGITES_MSGS="$(git log -1 --format=%s "$AFTER" || true)"
            else
              _TMP_ALGITES_MSGS="$(git log --format=%s "$BEFORE..$AFTER" || true)"
            fi
          else
            _TMP_ALGITES_MSGS="$(git log -1 --format=%s "${{ github.sha }}" || true)"
          fi

          export _TMP_ALGITES_REF _TMP_ALGITES_ORG _TMP_ALGITES_REPO _TMP_ALGITES_MSGS
          python3 - <<'PY'
          import os, re

          ref = os.environ.get("_TMP_ALGITES_REF", "")
          org = os.environ.get("_TMP_ALGITES_ORG", "Algites-EU")
          repo = os.environ.get("_TMP_ALGITES_REPO", "")
          msgs = os.environ.get("_TMP_ALGITES_MSGS", "")

          # Branch conventions (recommended, strict):
          # .../feature/ID.123_some-text
          # .../feature/ID.pub.tool.Java-123_some-text
          #
          # Commit conventions (supported):
          # #123
          # #ID.123
          # #pub.tool.Java-123
          # #ID.pub.tool.Java-123
          #
          # Notes:
          # - branch parsing is intentionally strict (requires "ID." + "_" delimiter)
          # - cross-repo shorthand assumes the Algites-EU organization
          refs = set() # (repo_full, issue_number)

          # --- Branch parsing (strict, forcing: "ID.<...>" followed by underscore) ---
          for m in re.finditer(r'(?:^|/)ID\.(\d{1,9})_', ref):
              refs.add((repo, m.group(1)))

          for m in re.finditer(r'(?:^|/)ID\.([A-Za-z0-9.]+)-(\d{1,9})_', ref):
              alias, num = m.group(1), m.group(2)
              refs.add((f"{org}/{alias}", num))

          # --- Commit parsing (#token) ---
          for token in re.findall(r'#[A-Za-z0-9.\-]{1,120}', msgs):
              t = token[1:] # strip '#'
              if t.startswith("ID."):
                  t = t[3:]

              if re.fullmatch(r'\d{1,9}', t):
                  refs.add((repo, t))
                  continue

              m = re.fullmatch(r'([A-Za-z0-9.]+)-(\d{1,9})', t)
              if m:
                  alias, num = m.group(1), m.group(2)
                  refs.add((f"{org}/{alias}", num))

          out_path = os.environ.get("GITHUB_OUTPUT")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if not refs:
              if out_path:
                  with open(out_path, "a", encoding="utf-8") as f:
                      f.write("found=false\n")
                      f.write("issues=\n")
              raise SystemExit(0)

          refs_sorted = sorted(refs, key=lambda x: (x[0], int(x[1])))

          if out_path:
              with open(out_path, "a", encoding="utf-8") as f:
                  f.write("found=true\n")
                  f.write("issues=" + " ".join([f"{r}#{n}" for r,n in refs_sorted]) + "\n")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as s:
                  s.write("## Related Issues\n\n")
                  for r, n in refs_sorted:
                      s.write(f"- [{r}#{n}](https://github.com/{r}/issues/{n})\n")
                  s.write("\n")
                  s.write("> Detected from branch name (e.g. `feature/ID.123_...`) and/or commit subjects containing `#123`, `#pub.tool.Java-123`, etc.\n")
          PY

      - name: Emit related-issue notices
        if: ${{ steps.issues.outputs.found == 'true' }}
        shell: bash
        run: |
          for item in ${{ steps.issues.outputs.issues }}; do
            echo "::notice title=Related Issue::$item"
          done

      - name: Detect Java version
        id: detect-java
        if: ${{ inputs.java-version == '' && steps.mode.outputs.mode != 'skip' }}
        shell: bash
        run: |
          # Preferred: .java-version (one integer line)
          if [ -f .java-version ]; then
            v="$(tr -d '\r\n' < .java-version)"
            if [[ "$v" =~ ^[0-9]+$ ]]; then
              echo "version=$v" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Gradle: gradle.properties with javaVersion=17
          if [ -f gradle.properties ] && grep -q '^javaVersion=' gradle.properties; then
            v="$(grep '^javaVersion=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \r\n')"
            if [[ "$v" =~ ^[0-9]+$ ]]; then
              echo "version=$v" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "version=17" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: ${{ steps.mode.outputs.mode != 'skip' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version != '' && inputs.java-version || steps.detect-java.outputs.version }}

      - name: Resolve required Algites credentials
        id: algites-credential-plan
        if: ${{ steps.mode.outputs.mode != 'skip' }}
        shell: bash
        env:
          _TMP_ALGITES_CREDENTIAL_PREFLIGHT: "true"
        run: |
          set -euo pipefail
          chmod +x "${GITHUB_WORKSPACE}/gradlew" || true
          locPlanFile="${RUNNER_TEMP}/algites-required-credentials.json"
          "${GITHUB_WORKSPACE}/gradlew" --no-daemon -q \
            resolveAlgitesRequiredCredentials \
            -Palgites.credential.usages=download \
            -Palgites.credential.download.stabilities=release,snapshot \
            -Palgites.credential.output="${locPlanFile}"
          echo "plan_file=${locPlanFile}" >> "${GITHUB_OUTPUT}"

      - name: Materialize required Algites credentials
        if: ${{ steps.mode.outputs.mode != 'skip' }}
        uses: Algites-EU/pub.gov.Algites/.github/actions/algites-export-credential-secrets@main
        with:
          credentials-json: ${{ secrets.ALGITES_DEVOPS_BUILD_REPOSITORY_CREDENTIALS }}
          required-credentials-file: ${{ steps.algites-credential-plan.outputs.plan_file }}
          secrets-json: ${{ secrets._TMP_ALGITES_CREDENTIAL_SECRETS_JSON }}

      - name: Resolve Algites artifact metadata
        id: algites-metadata
        if: ${{ steps.mode.outputs.mode != 'skip' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${GITHUB_WORKSPACE}/gradlew" || true

          LOC_RESOLVER_PROJECT_DIR="${RUNNER_TEMP}/algites-ci-resolve-project"
          rm -rf "${LOC_RESOLVER_PROJECT_DIR}"
          mkdir -p "${LOC_RESOLVER_PROJECT_DIR}"

          cat > "${LOC_RESOLVER_PROJECT_DIR}/settings.gradle.kts" <<'KTS'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  mavenCentral()
                  google()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  mavenCentral()
                  google()
              }
          }

          rootProject.name = "algites-ci-resolve"
          KTS

          cat > "${LOC_RESOLVER_PROJECT_DIR}/build.gradle.kts" <<'KTS'
          import java.io.File

          val locRepositoryDirectory = File(System.getenv("_TMP_ALGITES_METADATA_REPOSITORY_DIR"))
          val locResolverCoreScript = File(locRepositoryDirectory, "gradle/tool/repository/algites-artifact-directory-metadata-resolver.gradle.kts")

          if (locResolverCoreScript.isFile) {
              apply(from = locResolverCoreScript)
          } else {
              apply(from = uri("https://raw.githubusercontent.com/Algites-EU/pub.gov.Algites/main/gradle/tool/repository/algites-artifact-directory-metadata-resolver.gradle.kts"))
          }

          tasks.register("algitesCiResolveMetadata") {
              group = "algites"
              description = "Resolves Algites artifact metadata for GitHub Actions."

              doLast {
                  @Suppress("UNCHECKED_CAST")
                  val locResolveMetadataMap = rootProject.extra["algitesResolveArtifactDirectoryMetadataMap"] as (
                      File,
                      String?,
                      String?,
                      String?,
                      String?
                  ) -> Map<String, Any?>

                  @Suppress("UNCHECKED_CAST")
                  val locFlattenMetadata = rootProject.extra["algitesFlattenArtifactDirectoryMetadata"] as (Map<String, Any?>) -> Map<String, String>

                  val locMetadata = locResolveMetadataMap(
                      locRepositoryDirectory,
                      "",
                      "current-with-subdirs",
                      providers.gradleProperty("repository.name").orNull,
                      providers.gradleProperty("repository.visibility").orNull
                  )
                  val locProperties = locFlattenMetadata(locMetadata)
                  val locArtifactDirectoryCount = locProperties["artifactDirectories.count"]?.toIntOrNull() ?: 0

                  fun AIcNormalize(aValue: String?): String {
                      return aValue?.takeUnless { it == "null" } ?: ""
                  }

                  var locRootArtifactDirectoryIndex = -1
                  for (locIndex in 0 until locArtifactDirectoryCount) {
                      val locGradleProjectPath = AIcNormalize(locProperties["artifactDirectories.${locIndex}.gradleProjectPath"])
                      val locPath = AIcNormalize(locProperties["artifactDirectories.${locIndex}.path"])
                      if (locGradleProjectPath == ":" || locPath == "." || locPath == "") {
                          locRootArtifactDirectoryIndex = locIndex
                          break
                      }
                  }
                  if (locRootArtifactDirectoryIndex < 0 && locArtifactDirectoryCount > 0) {
                      locRootArtifactDirectoryIndex = 0
                  }

                  fun AIcRootProperty(aSuffix: String): String {
                      return if (locRootArtifactDirectoryIndex >= 0) {
                          AIcNormalize(locProperties["artifactDirectories.${locRootArtifactDirectoryIndex}.${aSuffix}"])
                      } else {
                          ""
                      }
                  }

                  println("_TMP_ALGITES_CI_ARTIFACT_INDEX=${locRootArtifactDirectoryIndex}")
                  println("_TMP_ALGITES_CI_VERSION_LANE=${AIcRootProperty("version.lane")}")
                  println("_TMP_ALGITES_CI_VERSION_REVISION=${AIcRootProperty("version.revision")}")
                  println("_TMP_ALGITES_CI_VERSION_QUALIFIER_KIND=${AIcRootProperty("version.qualifierKind")}")
                  println("_TMP_ALGITES_CI_VERSION_RESOLVED_VALUE=${AIcRootProperty("version.resolvedValue")}")
              }
          }
          KTS

          RESOLVED_METADATA="$(_TMP_ALGITES_METADATA_REPOSITORY_DIR="${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/gradlew" --no-daemon -q --project-dir "${LOC_RESOLVER_PROJECT_DIR}" algitesCiResolveMetadata)"
          printf '%s\n' "$RESOLVED_METADATA"

          algites_ci_get_value() {
            printf '%s\n' "$RESOLVED_METADATA" | sed -n "s/^_TMP_ALGITES_CI_$1=//p" | tail -n 1
          }

          {
            echo "artifact_index=$(algites_ci_get_value ARTIFACT_INDEX)"
            echo "version_lane=$(algites_ci_get_value VERSION_LANE)"
            echo "version_revision=$(algites_ci_get_value VERSION_REVISION)"
            echo "version_qualifier_kind=$(algites_ci_get_value VERSION_QUALIFIER_KIND)"
            echo "version_resolved_value=$(algites_ci_get_value VERSION_RESOLVED_VALUE)"
          } >> "$GITHUB_OUTPUT"

      - name: Lane consistency + snapshot version (lane branches)
        id: lanever
        if: ${{ steps.mode.outputs.mode != 'skip' }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"

          # Defaults (for non-lane branches)
          {
            echo "is_lane=false"
            echo "lane="
            echo "variant="
            echo "snapshot_version="
          } >> "$GITHUB_OUTPUT"

          # Only apply versioning to lane branches.
          if [[ ! "$BRANCH" =~ (^|/)lane/([^/]+) ]]; then
            exit 0
          fi

          BRANCH_LANE="${BASH_REMATCH[2]}"
          echo "is_lane=true" >> "$GITHUB_OUTPUT"

          # Determine variant as the first segment (must not be 'lane' itself).
          PREFIX="${BRANCH%%/*}"
          case "$PREFIX" in
            lane|feature|main|master|develop|hotfix)
              echo "::error::Lane branches must be variant-prefixed, e.g. 'jvm17/lane/1.1' (got '$BRANCH')."
              exit 1
              ;;
          esac

          VARIANT="$PREFIX"
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"

          REPO_LANE="${{ steps.algites-metadata.outputs.version_lane }}"
          REPO_REVISION="${{ steps.algites-metadata.outputs.version_revision }}"
          REPO_QUALIFIER_KIND="${{ steps.algites-metadata.outputs.version_qualifier_kind }}"
          RESOLVED_VERSION="${{ steps.algites-metadata.outputs.version_resolved_value }}"

          if [[ -z "$REPO_LANE" ]]; then
            echo "::error::Resolved root artifact version.lane is missing/empty."
            exit 1
          fi

          if [[ -z "$REPO_REVISION" ]]; then
            echo "::error::Resolved root artifact version.revision is missing/empty."
            exit 1
          fi

          if [[ ! "$REPO_REVISION" =~ ^[0-9]+$ ]]; then
            echo "::error::Resolved root artifact version.revision must be a non-negative integer. Got: '$REPO_REVISION'."
            exit 1
          fi

          # Branch lane must match the resolved root artifact version lane.
          if [[ "$BRANCH_LANE" != "$REPO_LANE" ]]; then
            echo "::error::Lane mismatch. Branch lane='$BRANCH_LANE' but resolved root artifact version.lane='$REPO_LANE'."
            exit 1
          fi

          if [[ ! "$REPO_LANE" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Resolved root artifact version.lane must be a numeric dot-separated identifier, e.g. 1 or 1.1. Got: '$REPO_LANE'."
            exit 1
          fi

          echo "lane=$REPO_LANE" >> "$GITHUB_OUTPUT"

          if [[ -n "$RESOLVED_VERSION" ]]; then
            SNAPSHOT_VERSION="$RESOLVED_VERSION"
          else
            VERSION_BASE="${REPO_LANE}.${REPO_REVISION}"
            REPO_QUALIFIER_KIND_UPPER="$(echo "${REPO_QUALIFIER_KIND:-}" | tr '[:lower:]' '[:upper:]')"
            if [[ "$REPO_QUALIFIER_KIND_UPPER" == "SNAPSHOT" ]]; then
              SNAPSHOT_VERSION="${VERSION_BASE}-SNAPSHOT"
            else
              SNAPSHOT_VERSION="${VERSION_BASE}"
            fi
          fi

          echo "snapshot_version=$SNAPSHOT_VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "### B1 Version (lane branches)"
            echo ""
            echo "- Branch: \`${BRANCH}\`"
            echo "- Variant: \`${VARIANT}\`"
            echo "- Lane: \`${REPO_LANE}\`"
            echo "- Revision: \`${REPO_REVISION}\`"
            echo "- Qualifier kind: \`${REPO_QUALIFIER_KIND:-}\`"
            echo "- Qualifier label: \`${REPO_QUALIFIER_LABEL:-}\`"
            echo "- Computed Version: \`${SNAPSHOT_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate GitHub App token
        id: app-token
        if: ${{ inputs.github-app-enabled && steps.mode.outputs.mode != 'skip' }}
        uses: actions/github-app-token@v1
        with:
          app-id: ${{ secrets.GITHUB_APP_ID }}
          private-key: ${{ secrets.GITHUB_APP_PEM }}

      # -------------------------
      # Construction mode
      # -------------------------
      - name: Gradle construction only
        if: ${{ steps.mode.outputs.mode == 'compile' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          chmod +x "${GITHUB_WORKSPACE}/gradlew" || true
          _TMP_ALGITES_VERSION="${{ steps.lanever.outputs.snapshot_version }}"
          EXTRA=""
          if [[ -n "$_TMP_ALGITES_VERSION" ]]; then EXTRA="-PalgitesVersion=$_TMP_ALGITES_VERSION"; fi
          echo "=== Gradle construction: compile (including test sources, without test execution) ==="
          "${GITHUB_WORKSPACE}/gradlew" --no-daemon $EXTRA ${{ inputs.gradle-construction-task }}

      # -------------------------
      # Verification mode
      # -------------------------
      - name: Gradle verification
        if: ${{ steps.mode.outputs.mode == 'test' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          chmod +x "${GITHUB_WORKSPACE}/gradlew" || true
          _TMP_ALGITES_VERSION="${{ steps.lanever.outputs.snapshot_version }}"
          EXTRA=""
          if [[ -n "$_TMP_ALGITES_VERSION" ]]; then EXTRA="-PalgitesVersion=$_TMP_ALGITES_VERSION"; fi
          echo "=== Gradle verification: test+integration test, no packaging ==="
          "${GITHUB_WORKSPACE}/gradlew" --no-daemon $EXTRA ${{ inputs.gradle-verification-task }}

      # -------------------------
      # Approval mode
      # -------------------------
      - name: Gradle approval
        if: ${{ steps.mode.outputs.mode == 'verify' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          chmod +x "${GITHUB_WORKSPACE}/gradlew" || true
          _TMP_ALGITES_VERSION="${{ steps.lanever.outputs.snapshot_version }}"
          EXTRA=""
          if [[ -n "$_TMP_ALGITES_VERSION" ]]; then EXTRA="-PalgitesVersion=$_TMP_ALGITES_VERSION"; fi
          echo "=== Gradle approval (test+integration test, with packaging) ==="
          "${GITHUB_WORKSPACE}/gradlew" --no-daemon $EXTRA ${{ inputs.gradle-approval-task }}

      - name: Skip (non-matching branch)
        if: ${{ steps.mode.outputs.mode == 'skip' }}
        run: |
          echo "Mode=skip → no construction/verification/approval for this branch."
